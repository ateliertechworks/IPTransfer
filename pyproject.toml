[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-p2p-sync"
dynamic = ["version"]
description = "Embedded, serverless peer-to-peer data synchronization SDK for applications on a local network."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Universal P2P Sync contributors" }]
keywords = ["p2p", "sync", "lan", "mdns", "offline-first", "postgresql", "tls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "zeroconf>=0.132",
    "ifaddr>=0.2",
    "cryptography>=42",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
]

[tool.setuptools.dynamic]
version = { attr = "universal_p2p_sync._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_p2p_sync = ["py.typed"]
"universal_p2p_sync.storage.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 90
markers = [
    "mdns: requires working multicast DNS on the host (set UP2P_SKIP_MDNS_TESTS=1 to skip)",
    "multiprocess: spawns peer subprocesses",
    "postgres: needs PostgreSQL (UP2P_TEST_DATABASE_URL); skipped when unset",
]
